<div class="action-menu" (click)="$event.stopPropagation()">
  <button
    type="button"
    class="icon-button"
    (click)="toggleMenu($event)"
    [attr.aria-expanded]="vm().isOpen"
    aria-haspopup="true"
    aria-label="Abrir menú de acciones"
  >
    ⋮
  </button>

  @if (vm().isOpen) {
    <div class="menu" [class.menu-up]="vm().menuPosition === 'up'">
      <button type="button" class="menu-item" (click)="edit()">
        Editar
      </button>
      <button type="button" class="menu-item danger" (click)="delete()">
        Eliminar
      </button>
    </div>
  }
</div>
